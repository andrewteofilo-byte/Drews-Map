<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drew's Secret Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#13233a;
  --land:#2b3e57;
  --land-edge:#3d5577;
  --state:#7d93b3;
  --panel:#1a2d47;
  --panel-edge:#2c4466;
  --text:#e9eff7;
  --muted:#a3b3c9;
  --select:#ffffff;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body:"Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--text);font:400 15px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--select);outline-offset:2px}

/* Header bar, styled like a station's on-air ticker strip */
header{display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--panel-edge);background:#0f1d31;flex-wrap:wrap}
.mark{font:700 26px/1 var(--cond);letter-spacing:.01em;margin:0}
.count{font:600 18px/1 var(--cond);color:var(--muted)}
.count strong{color:var(--text);font-weight:700}
.clock{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px}
.clock .syd{font:600 20px/1 var(--cond);color:var(--text)}
.refresh{background:transparent;border:1px solid var(--panel-edge);border-radius:4px;padding:6px 12px;cursor:pointer}
.refresh:hover{border-color:var(--state)}

.notice{display:none;padding:8px 18px;font-size:14px;background:#24364f;border-bottom:1px solid var(--panel-edge)}
.notice.show{display:block}
.notice.error{background:#4a1f26}

main{flex:1;display:grid;grid-template-columns:270px 1fr;min-height:0;position:relative}

/* Active markets list */
aside{border-right:1px solid var(--panel-edge);overflow-y:auto;min-height:0}
aside h2{font:600 17px/1.2 var(--cond);margin:14px 16px 8px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0 8px 16px}
.mlist button{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:7px 8px;cursor:pointer}
.mlist button:hover,.mlist button[aria-current="true"]{background:var(--panel)}
.mlist .bar{align-self:stretch;border-radius:2px}
.mlist .nm{font:600 16px/1.15 var(--cond)}
.mlist .ev{display:block;font-size:13px;color:var(--muted)}
.mlist .n{font:600 15px/1 var(--cond);color:var(--muted)}
.empty{margin:0 16px;color:var(--muted);font-size:14px}

/* Map */
.mapwrap{position:relative;min-height:0}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.county{fill:var(--land);stroke:none}
.cty{stroke:rgba(255,255,255,.08);stroke-width:.4;vector-effect:non-scaling-stroke;cursor:pointer}
.cty:hover{stroke:var(--text);stroke-width:1.2}
.cty.picked{stroke:var(--select);stroke-width:2}
.mkt{fill:none;stroke:#8ea4c4;stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
.mkt.sel{stroke:var(--select);stroke-width:2.6}
.warn .here{font:600 12px/1 var(--body);border:1px solid var(--text);color:var(--text);border-radius:3px;padding:2px 5px;margin-left:6px;vertical-align:2px}
.picked-note{font-size:14px;margin:-12px 0 16px;color:var(--text)}
.states{fill:none;stroke:var(--state);stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:#0f1d31;border:1px solid var(--panel-edge);border-radius:4px;padding:6px 9px;font-size:13px;display:none;max-width:240px}
.tip b{font:600 15px/1.2 var(--cond);display:block}

.legend{position:absolute;left:14px;bottom:14px;background:rgba(15,29,49,.88);border:1px solid var(--panel-edge);border-radius:4px;padding:8px 10px;font-size:13px;max-width:min(320px,70%);max-height:40%;overflow-y:auto}
.legend:empty{display:none}
.legend div{display:flex;align-items:center;gap:8px;line-height:1.7}
.swatch{width:14px;height:10px;border-radius:2px;flex:none}
.legend .c{margin-left:auto;color:var(--muted);padding-left:10px}

.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:34px;height:34px;background:#0f1d31;border:1px solid var(--panel-edge);border-radius:4px;cursor:pointer;font-size:18px}

/* Market panel: slides over the map from the right */
.panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--panel-edge);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;padding:18px 20px 28px}
.panel.open{transform:none}
.panel .close{position:absolute;top:12px;right:12px;background:transparent;border:1px solid var(--panel-edge);border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1}
.panel h2{font:700 30px/1.05 var(--cond);margin:0 40px 4px 0}
.panel .meta{color:var(--muted);margin:0 0 18px;font-size:14px}
.panel h3{font:600 19px/1.2 var(--cond);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--panel-edge)}
.warn{border-left:5px solid;padding:2px 0 2px 12px;margin:0 0 16px}
.warn .ev{font:700 20px/1.15 var(--cond)}
.warn .tag{font:600 13px/1 var(--body);background:var(--text);color:var(--sky);border-radius:3px;padding:2px 5px;margin-left:6px;vertical-align:2px}
.warn p{margin:3px 0;font-size:14px}
.warn .when{color:var(--text)}
.warn .small{color:var(--muted)}
.warn details{margin-top:6px;font-size:13.5px}
.warn summary{cursor:pointer;color:var(--muted)}
.warn pre{white-space:pre-wrap;font:13px/1.45 var(--body);margin:6px 0 0;color:var(--text)}
.later{color:var(--muted);font-size:14px;margin:0}
.levels{display:flex;gap:6px}
.levels button{background:transparent;border:1px solid var(--panel-edge);border-radius:4px;padding:5px 10px;cursor:pointer;font:600 15px/1 var(--cond);color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--text);color:var(--sky);border-color:var(--text)}
.poly{fill-opacity:.9;stroke:#fff !important;stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
.warn .issued{color:var(--muted)}
.warn .also{font-size:13px;color:var(--muted);margin-top:4px}
.mlink{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;cursor:pointer;font:inherit}
.watchlist{display:flex;flex-wrap:wrap;gap:6px}
.watch{display:inline-block;background:transparent;border:1px solid var(--panel-edge);color:var(--text);border-radius:4px;padding:6px 10px;font:600 15px/1 var(--cond);text-decoration:none}
.watch:hover{border-color:var(--text)}
.watch .net{color:var(--muted);font-weight:500}
.outlook{display:flex;gap:6px;align-items:center}
.outlook span{font:600 15px/1 var(--cond);color:var(--muted);margin-right:2px}
.outlook button{background:transparent;border:1px solid var(--panel-edge);border-radius:4px;padding:5px 9px;cursor:pointer;font:600 15px/1 var(--cond);color:var(--muted)}
.outlook button[aria-pressed="true"]{background:var(--text);color:var(--sky);border-color:var(--text)}
.outlook button:disabled{opacity:.4;cursor:not-allowed}
.spc{stroke:rgba(0,0,0,.35);stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.spcbox{border-left:5px solid;padding:2px 0 2px 12px;margin:0 0 6px}
.spcbox b{font:700 19px/1.2 var(--cond)}
.spcbox p{margin:2px 0;font-size:13.5px;color:var(--muted)}
.legend .head{font:600 14px/1.6 var(--cond);color:var(--muted);margin-top:4px}
.radar{position:relative;width:100%;aspect-ratio:340/210;background:#0b1626;border:1px solid var(--panel-edge);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.radar img{position:absolute;display:block;max-width:none}
.radar svg{position:absolute;inset:0;width:100%;height:100%}
.radar .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.rcap{font-size:12.5px;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rcap a{color:var(--text)}
.hidden-note{font-size:13px;color:var(--muted);margin:-6px 0 12px}

footer{padding:5px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--panel-edge);background:#0f1d31}

@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--panel-edge);max-height:34vh}
  .panel{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--panel-edge);transform:translateY(100%)}
  .clock{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<header>
  <h1 class="mark">Drew's Secret Map</h1>
  <span class="count" id="count">Loading warnings…</span>
  <div class="levels" role="group" aria-label="Alert levels shown">
    <button type="button" data-level="warning" aria-pressed="true">Warnings</button>
    <button type="button" data-level="watch" aria-pressed="true">Watches</button>
    <button type="button" data-level="other" aria-pressed="false">Advisories</button>
  </div>
  <div class="outlook" role="group" aria-label="SPC convective outlook">
    <span>SPC</span>
    <button type="button" data-day="0">Off</button>
    <button type="button" data-day="1">Day 1</button>
    <button type="button" data-day="2">Day 2</button>
    <button type="button" data-day="3">Day 3</button>
  </div>
  <div class="clock">
    <span>Sydney <span class="syd" id="syd">--:--</span></span>
    <span id="updated"></span>
    <button class="refresh" id="refresh" type="button">Refresh now</button>
  </div>
</header>
<div class="notice" id="notice" role="status"></div>

<main>
  <aside aria-label="Markets with active alerts">
    <h2 id="listhead">Markets under alerts</h2>
    <ul class="mlist" id="mlist"></ul>
  </aside>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" aria-label="Map of US television markets coloured by most serious active NWS alert"></svg>
    <div class="tip" id="tip"></div>
    <div class="legend" id="legend" aria-label="Alert types on the map"></div>
    <div class="zoomctl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset" aria-label="Reset view">⤢</button>
    </div>
    <section class="panel" id="panel" aria-live="polite" aria-label="Market details">
      <button class="close" id="close" type="button" aria-label="Close market panel">×</button>
      <div id="pbody"></div>
    </section>
  </div>
</main>
<footer id="foot">Alerts from the National Weather Service (api.weather.gov), refreshed every 2 minutes.</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ---------- Settings ---------- */
const ATLAS_URL  = 'https://cdn.jsdelivr.net/npm/us-atlas@3/counties-albers-10m.json'; // pre-projected, Alaska + Hawaii inset
const CROSSWALK  = 'county-dma-crosswalk.json';  // Drew's Secret export, beside index.html on GitHub Pages
const ALERTS_URL = 'https://api.weather.gov/alerts/active?status=actual';
const REFRESH_MS = 120000;
const SYD        = 'Australia/Sydney';
const STATIONS   = 'data/station-markets.json';
/* SPC categorical outlooks: SPC's own files first, NOAA's map server copy if those are blocked */
const SPC_SOURCES = {
  1: ['https://www.spc.noaa.gov/products/outlook/day1otlk_cat.lyr.geojson', 'https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/SPC_wx_outlks/MapServer/1/query?where=1%3D1&outFields=*&f=geojson'],
  2: ['https://www.spc.noaa.gov/products/outlook/day2otlk_cat.lyr.geojson', 'https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/SPC_wx_outlks/MapServer/9/query?where=1%3D1&outFields=*&f=geojson'],
  3: ['https://www.spc.noaa.gov/products/outlook/day3otlk_cat.lyr.geojson']
};
const SPC_REFRESH_MS = 900000;
/* Radar snippets */
const RADAR_SITES  = 'https://api.weather.gov/radar/stations';
const NOAA_RADAR   = 'https://opengeo.ncep.noaa.gov/geoserver';        // per-site reflectivity, airport-radar velocity, national mosaic
const IEM_TILES    = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0';  // NEXRAD single-site velocity
const COUNTY_LINES = 'https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json'; // unprojected county outlines for the snippet
const RADAR_EVENTS = /^(Tornado Warning|Tornado Emergency|Severe Thunderstorm Warning|Flash Flood Warning|Flash Flood Emergency|Extreme Wind Warning)$/;
const SPC_CATS = [   // lowest to highest, SPC's standard colours
  {code:'TSTM', name:'General thunderstorms', level:0, color:'#c1e9c1'},
  {code:'MRGL', name:'Marginal risk',  level:1, color:'#66a366'},
  {code:'SLGT', name:'Slight risk',    level:2, color:'#f6f67f'},
  {code:'ENH',  name:'Enhanced risk',  level:3, color:'#e6c27f'},
  {code:'MDT',  name:'Moderate risk',  level:4, color:'#e67f7f'},
  {code:'HIGH', name:'High risk',      level:5, color:'#ff7fff'}
];  // Drew's Secret station list: networks, rank, stream links

/* County code changes between the map's boundary year and newer data.
   Connecticut's planning regions (Census 2022+) fold back to the old counties;
   every CT county is Hartford & New Haven except Fairfield (New York), and the
   regions below don't cross that line. Valdez-Cordova split in 2019. */
const FIPS_ALIASES = {
  '09110':'09003','09120':'09001','09130':'09007','09140':'09009','09150':'09015',
  '09160':'09005','09170':'09009','09180':'09011','09190':'09001',
  '02063':'02261','02066':'02261'
};
const norm = f => { f = String(f).padStart(5,'0').slice(-5); return FIPS_ALIASES[f] || f; };

/* Alert priority, most serious first. Colours follow the NWS hazard map. */
const HAZARDS = [
  ['Tornado Emergency','#ff00ff'],
  ['Flash Flood Emergency','#ff00ff'],
  ['Tsunami Warning','#fd6347'],
  ['Tornado Warning','#ff0000'],
  ['Extreme Wind Warning','#ff8c00'],
  ['Severe Thunderstorm Warning','#ffa500'],
  ['Flash Flood Warning','#8b0000'],
  ['Hurricane Warning','#dc143c'],
  ['Storm Surge Warning','#b524f7'],
  ['Fire Warning','#a0522d'],
  ['Evacuation Immediate','#7fff00'],
  ['Blizzard Warning','#ff4500'],
  ['Snow Squall Warning','#c71585'],
  ['Ice Storm Warning','#8b008b'],
  ['Winter Storm Warning','#ff69b4'],
  ['Tropical Storm Warning','#b22222'],
  ['High Wind Warning','#daa520'],
  ['Extreme Heat Warning','#c71585'],
  ['Excessive Heat Warning','#c71585'],
  ['Red Flag Warning','#ff1493'],
  ['Dust Storm Warning','#ffe4c4'],
  ['Flood Warning','#00ff00'],
  ['Freeze Warning','#483d8b'],
  ['Extreme Cold Warning','#0000ff'],
  ['Tornado Watch','#ffff00'],
  ['Severe Thunderstorm Watch','#db7093'],
  ['Hurricane Watch','#ff00ff'],
  ['Tropical Storm Watch','#f08080'],
  ['Flash Flood Watch','#2e8b57'],
  ['Winter Storm Watch','#4682b4'],
  ['Flood Advisory','#00ff7f'],
  ['Special Weather Statement','#ffe4b5'],
  ['Winter Weather Advisory','#7b68ee'],
  ['Wind Advisory','#d2b48c'],
  ['Heat Advisory','#ff7f50'],
  ['Dense Fog Advisory','#708090'],
  ['Frost Advisory','#6495ed']
];
const PRIORITY = new Map(HAZARDS.map(([e,c],i)=>[e,{p:i,color:c}]));
function hazardInfo(event){
  if (PRIORITY.has(event)) return PRIORITY.get(event);
  // Anything not listed sorts by its kind, with a muted colour
  if (/Warning$/.test(event))   return {p:1000,color:'#c9a0a0'};
  if (/Watch$/.test(event))     return {p:2000,color:'#b8b880'};
  if (/Advisory$/.test(event))  return {p:3000,color:'#8fa8a0'};
  return {p:4000,color:'#8a96a8'};
}
function classify(p){
  const params = p.parameters || {};
  const val = k => (params[k] || []).join(' ');
  let event = p.event;
  const tags = [];
  if (event === 'Tornado Warning'){
    if (/CATASTROPHIC/i.test(val('tornadoDamageThreat'))) event = 'Tornado Emergency';
    else if (/CONSIDERABLE/i.test(val('tornadoDamageThreat'))) tags.push('PDS');
    if (/OBSERVED/i.test(val('tornadoDetection'))) tags.push('Observed');
    else if (/RADAR/i.test(val('tornadoDetection'))) tags.push('Radar indicated');
  }
  if (event === 'Severe Thunderstorm Warning'){
    // Destructive is the tier that triggers a Wireless Emergency Alert
    if (/DESTRUCTIVE/i.test(val('thunderstormDamageThreat'))) tags.push('Destructive');
    else if (/CONSIDERABLE/i.test(val('thunderstormDamageThreat'))) tags.push('Considerable');
    if (/POSSIBLE/i.test(val('tornadoDetection'))) tags.push('Tornado possible');
  }
  if (event === 'Flash Flood Warning'){
    if (/CATASTROPHIC/i.test(val('flashFloodDamageThreat'))) event = 'Flash Flood Emergency';
    else if (/CONSIDERABLE/i.test(val('flashFloodDamageThreat'))) tags.push('Considerable');
  }
  const level = /(Warning|Emergency|Evacuation Immediate)$/.test(event) ? 'warning' : /Watch$/.test(event) ? 'watch' : 'other';
  return {event, tags, level, ...hazardInfo(event)};
}

/* ---------- State ---------- */
let topo, countyName = new Map(), stateName = new Map();
let markets = new Map();          // id -> {id,name,rank,tz,fips:[]}
let countyToMarket = new Map();   // fips -> market id
let marketFeatures = [];
let alertsByMarket = new Map();   // market id -> [{p, cls, fips}]
let mode = 'markets';             // or 'counties' when no crosswalk
let selected = null;
let pickedCounty = null;          // fips of the county clicked, highlighted in the panel
let alertsByCounty = new Map();   // fips -> [{ p, cls }]
let marketInfo = new Map();      // market name -> { rank, stations: [{ call, networks, tier, url, note }] }
let alertMarkets = new Map();    // alert id -> [market ids], for "also covers"
let polygons = [];               // storm-based warning shapes: [{ geometry, cls }]
let levels = new Set(['warning','watch']);
let spcDay = 1;                  // 0 = off
try { const d = +localStorage.getItem('dsm-spc'); if ([0,1,2,3].includes(d) && localStorage.getItem('dsm-spc') !== null) spcDay = d; } catch(e){}
let radarSites = [];             // [{ id, name, type, lonlat }]
let radarSitesReady = Promise.resolve();
let countyOutlines = null;       // [{ geometry, bounds }] once loaded
const spcData = {};              // day -> { features: [{ cat, geometry, rings }], issued, valid, expires } or { failed:true }
const spcByMarket = new Map();   // market id -> highest SPC category for the day shown
let countyCentroids = new Map(); // county fips -> [x, y] on the map
try { const saved = JSON.parse(localStorage.getItem('dsm-levels')); if (Array.isArray(saved)) levels = new Set(saved); } catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* "WICHITA FALLS-LAWTON" -> "Wichita Falls-Lawton" for display only; data keeps the original */
function displayName(n){
  n = String(n || '');
  if (n !== n.toUpperCase() || !/[A-Z]{3}/.test(n)) return n;
  return n.toLowerCase().replace(/(^|[\s\-\/(.])([a-z])/g, (m, a, b) => a + b.toUpperCase());
}

function notice(msg, isError){
  const n = $('notice');
  n.textContent = msg || '';
  n.className = 'notice' + (msg ? ' show' : '') + (isError ? ' error' : '');
}

/* ---------- Time ---------- */
const sydFmt = new Intl.DateTimeFormat('en-AU',{timeZone:SYD,hour:'numeric',minute:'2-digit'});
const sydDayFmt = new Intl.DateTimeFormat('en-AU',{timeZone:SYD,weekday:'short',hour:'numeric',minute:'2-digit'});
function tickClock(){ $('syd').textContent = sydFmt.format(new Date()); }
function marketTime(iso, tz){
  if (!iso) return '';
  const d = new Date(iso);
  if (tz) {
    try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(d); }
    catch(e){ /* bad tz string: fall through */ }
  }
  // No market time zone: read the clock time and offset straight from the NWS timestamp
  const m = /T(\d\d):(\d\d).*?([+-]\d\d):?(\d\d)$/.exec(iso);
  if (!m) return '';
  let h = +m[1], ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  const off = parseInt(m[3], 10), offMin = +m[4];
  return `${h}:${m[2]} ${ap} (UTC${off < 0 || m[3][0] === '-' ? '−' : '+'}${Math.abs(off)}${offMin ? ':' + m[4] : ''})`;
}

/* ---------- Data loading ---------- */
async function loadCrosswalk(){
  try {
    const r = await fetch(CROSSWALK, {cache:'no-cache'});
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e){ return null; }
}

/* Reads the Drew's Secret export:
   { "_about":..., "crosswalk": { "48485":"Wichita Falls & Lawton", ... } }
   Optional extra block, used for the panel and sorting if present:
   "markets": { "Wichita Falls & Lawton": { "rank": 0, "tz": "America/Chicago" } }
   Also accepts a bare county-to-market lookup. Keys starting with _ are notes. */
function buildMarkets(cw){
  markets.clear(); countyToMarket.clear();
  const lookup = cw && (cw.crosswalk || cw);
  const meta = (cw && cw.markets && !Array.isArray(cw.markets)) ? cw.markets : {};
  if (lookup && typeof lookup === 'object') {
    for (const [f, name] of Object.entries(lookup)){
      if (f.startsWith('_') || typeof name !== 'string') continue;
      const nf = norm(f);
      if (!markets.has(name)) {
        const m = meta[name] || {};
        markets.set(name, {id:name, name, rank:m.rank ?? null, tz:m.tz || null, fips:[]});
      }
      const mk = markets.get(name);
      if (!mk.fips.includes(nf)) mk.fips.push(nf);
      countyToMarket.set(nf, name);
    }
  }
  if (!markets.size){
    mode = 'counties';
    for (const g of topo.objects.counties.geometries){
      const f = g.id;
      markets.set(f, {id:f, name:`${countyName.get(f)} County, ${stateName.get(f.slice(0,2)) || ''}`, rank:null, tz:null, fips:[f]});
      countyToMarket.set(f, f);
    }
  }
}

function buildFeatures(){
  const geoms = topo.objects.counties.geometries;
  if (mode === 'counties'){
    marketFeatures = topojson.feature(topo, topo.objects.counties).features
      .map(f => ({type:'Feature', id:f.id, geometry:f.geometry}));
    return;
  }
  const byMarket = new Map();
  for (const g of geoms){
    const m = countyToMarket.get(g.id);
    if (!m) continue;
    if (!byMarket.has(m)) byMarket.set(m, []);
    byMarket.get(m).push(g);
  }
  marketFeatures = [...byMarket].map(([id, gs]) => ({type:'Feature', id, geometry:topojson.merge(topo, gs)}));
}

async function loadStationList(){
  try {
    const r = await fetch(STATIONS, {cache:'no-cache'});
    if (!r.ok) return;
    const raw = await r.json();
    for (const st of (raw.stations || [])){
      const name = st.dma, call = String(st.base_callsign || st.callsign || '').toUpperCase();
      if (!name || !call) continue;
      if (!marketInfo.has(name)) marketInfo.set(name, {rank: st.dma_rank ?? null, stations: []});
      const mi = marketInfo.get(name);
      let row = mi.stations.find(x => x.call === call);
      if (!row){ row = {call, networks: [], tier: st.tier || '', url: st.feed?.url || '', note: st.feed?.note || ''}; mi.stations.push(row); }
      if (st.network && !row.networks.includes(st.network)) row.networks.push(st.network);
      if (!row.url && st.feed?.url) row.url = st.feed.url;
    }
    // Ranks from Drew's Secret fill in the panel and the list order
    for (const [name, mi] of marketInfo){ const m = markets.get(name); if (m && m.rank == null) m.rank = mi.rank; }
  } catch(e){ /* the map still works without it */ }
}

/* NWS polygons wind the opposite way to what d3 expects; without this a small
   warning box would be drawn as "everything except the box" */
function rewind(g){
  const fix = poly => poly.map(ring => d3.geoArea({type:'Polygon', coordinates:[ring]}) > 2 * Math.PI ? ring.slice().reverse() : ring);
  return g.type === 'Polygon' ? {type:'Polygon', coordinates: fix(g.coordinates)}
                              : {type:'MultiPolygon', coordinates: g.coordinates.map(fix)};
}

/* ---------- SPC outlooks ---------- */
function spcCategory(props){
  const vals = Object.values(props || {});
  for (const v of vals){
    const t = String(v ?? '').trim().toUpperCase();
    const c = SPC_CATS.find(x => x.code === t);
    if (c) return c;
  }
  for (const v of vals){
    const t = String(v ?? '');
    if (/general thunder/i.test(t)) return SPC_CATS[0];
    for (const c of SPC_CATS.slice(1)) if (new RegExp('^' + c.name.split(' ')[0] + '\\b', 'i').test(t)) return c;
  }
  const dn = +(props.DN ?? props.dn);   // SPC numbering: 2 thunder, 3 marginal ... 6 moderate, 8 high
  return {2:SPC_CATS[0],3:SPC_CATS[1],4:SPC_CATS[2],5:SPC_CATS[3],6:SPC_CATS[4],8:SPC_CATS[5]}[dn] || null;
}
function spcTime(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return new Date(v);
  const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(String(v));   // 202610021200, in UTC
  if (m) return new Date(Date.UTC(+m[1], m[2]-1, +m[3], +m[4], +m[5]));
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
const spcProj = d3.geoAlbersUsa().scale(1300).translate([487.5, 305]);

async function loadSPC(day){
  for (const url of SPC_SOURCES[day]){
    try {
      const r = await fetch(url, {cache:'no-cache'});
      if (!r.ok) continue;
      const gj = await r.json();
      const features = [];
      let issued = null, valid = null, expires = null;
      for (const f of (gj.features || [])){
        if (!f.geometry || !/Polygon/.test(f.geometry.type)) continue;
        const cat = spcCategory(f.properties);
        if (!cat) continue;
        const p = f.properties || {};
        issued  ||= spcTime(p.ISSUE  ?? p.issue  ?? p.idp_issueddate);
        valid   ||= spcTime(p.VALID  ?? p.valid  ?? p.idp_validtime);
        expires ||= spcTime(p.EXPIRE ?? p.expire ?? p.idp_expiretime);
        const geometry = rewind(f.geometry);
        // Rings projected onto the map, for working out which markets sit inside
        const polys = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
        const rings = polys.map(poly => poly.map(ring => ring.map(pt => spcProj(pt)).filter(Boolean)));
        features.push({cat, geometry, rings});
      }
      features.sort((a, b) => a.cat.level - b.cat.level);   // higher risks drawn on top
      spcData[day] = {features, issued, valid, expires, source: url};
      return;
    } catch(e){ /* try the next source */ }
  }
  spcData[day] = {failed: true};
}

function inRings(pt, polyRings){
  // inside the outer ring and not inside a hole
  if (!polyRings[0] || polyRings[0].length < 3 || !d3.polygonContains(polyRings[0], pt)) return false;
  return !polyRings.slice(1).some(h => h.length > 2 && d3.polygonContains(h, pt));
}
function computeSPCByMarket(){
  spcByMarket.clear();
  const data = spcData[spcDay];
  if (!spcDay || !data || data.failed) return;
  for (const [id, m] of markets){
    let best = null;
    for (const f of m.fips){
      const c = countyCentroids.get(f);
      if (!c) continue;
      for (let i = data.features.length - 1; i >= 0; i--){   // highest first
        const ft = data.features[i];
        if (best && ft.cat.level <= best.level) break;
        if (ft.rings.some(pr => inRings(c, pr))){ best = ft.cat; break; }
      }
    }
    if (best) spcByMarket.set(id, best);
  }
}

async function refreshSPC(){
  await Promise.all([1,2,3].map(loadSPC));
  document.querySelectorAll('.outlook button[data-day]').forEach(b => {
    const d = +b.dataset.day;
    if (d && spcData[d]?.failed){ b.disabled = true; b.title = "Couldn't load this outlook"; }
    else { b.disabled = false; b.title = ''; }
  });
  if (spcDay && spcData[spcDay]?.failed) notice("The SPC outlook couldn't be loaded. Warnings are unaffected.", false);
  computeSPCByMarket();
  paint();
}

async function loadAlerts(){
  let data;
  try {
    const r = await fetch(ALERTS_URL, {headers:{Accept:'application/geo+json'}, cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch(e){
    notice(`Couldn't reach the NWS alerts feed (${e.message}). Trying again in 2 minutes.`, true);
    return;
  }
  if (mode !== 'counties') notice('');

  // Drop alerts that a newer active alert has replaced
  const replaced = new Set();
  for (const f of data.features) for (const ref of (f.properties.references || [])) replaced.add(ref['@id'] || ref.identifier);

  const next = new Map(), nextAlso = new Map(), nextPolys = [], nextCounty = new Map();
  let unmatched = 0, used = 0;
  for (const f of data.features){
    const p = f.properties;
    if (p.messageType === 'Cancel' || replaced.has(p['@id']) || replaced.has(p.id)) continue;
    const same = (p.geocode && p.geocode.SAME) || [];
    const hit = new Map();
    for (const s of same){
      const fips = norm(s);
      const m = countyToMarket.get(fips);
      if (!m) continue;
      if (!hit.has(m)) hit.set(m, new Set());
      hit.get(m).add(fips);
    }
    if (!hit.size){ unmatched++; continue; }
    used++;
    const cls = classify(p);
    nextAlso.set(p.id, [...hit.keys()]);
    if (f.geometry && /Polygon/.test(f.geometry.type)) nextPolys.push({geometry: rewind(f.geometry), cls});
    for (const [m, set] of hit){
      if (!next.has(m)) next.set(m, []);
      next.get(m).push({p, cls, fips:[...set], geom: f.geometry && /Polygon/.test(f.geometry.type) ? f.geometry : null});
      for (const f of set){
        if (!nextCounty.has(f)) nextCounty.set(f, []);
        nextCounty.get(f).push({p, cls});
      }
    }
  }
  for (const list of next.values())
    list.sort((a,b) => a.cls.p - b.cls.p || new Date(a.p.ends || a.p.expires) - new Date(b.p.ends || b.p.expires));
  alertsByMarket = next;
  alertMarkets = nextAlso;
  for (const list of nextCounty.values()) list.sort((a, b) => a.cls.p - b.cls.p);
  alertsByCounty = nextCounty;
  polygons = nextPolys.sort((a, b) => b.cls.p - a.cls.p);   // most serious drawn last, on top

  $('updated').textContent = 'updated ' + sydFmt.format(new Date());
  $('foot').textContent = `Alerts from the National Weather Service (api.weather.gov), refreshed every 2 minutes. ${used} ${used === 1 ? 'alert' : 'alerts'} placed` +
    (unmatched ? `, ${unmatched} without a matching county (mostly marine and offshore zones).` : '.');
  paint();
}

function countyVisible(f){ return (alertsByCounty.get(f) || []).filter(a => levels.has(a.cls.level)); }
function visible(id){ return (alertsByMarket.get(id) || []).filter(a => levels.has(a.cls.level)); }
function topAlert(id){ const l = visible(id); return l.length ? l[0] : null; }

function levelWords(){
  const w = [levels.has('warning') && 'warnings', levels.has('watch') && 'watches', levels.has('other') && 'advisories'].filter(Boolean);
  return w.length === 3 || !w.length ? 'alerts' : w.length === 2 ? w.join(' or ') : w[0];
}

function paint(){
  gCty.selectAll('path')
    .style('fill', d => { const l = countyVisible(d.fips); return l.length ? l[0].cls.color : 'transparent'; })
    .style('fill-opacity', d => countyVisible(d.fips).length ? .5 : 0)   // dimmed so the actual warning polygons stand out
    .classed('picked', d => d.fips === pickedCounty);
  gCty.selectAll('path.picked').raise();
  gMarkets.selectAll('path').classed('sel', d => d.id === selected);
  gMarkets.selectAll('path.sel').raise();

  const spc = spcDay && spcData[spcDay] && !spcData[spcDay].failed ? spcData[spcDay].features : [];
  gSPC.selectAll('path').data(spc).join('path').attr('class','spc')
    .attr('d', d => polyPath(d.geometry)).style('fill', d => d.cat.color);

  gPolys.selectAll('path')
    .data(polygons.filter(x => levels.has(x.cls.level)))
    .join('path').attr('class','poly').attr('d', d => polyPath(d.geometry))
    .style('fill', d => d.cls.color).style('stroke', d => d.cls.color);

  const active = [...alertsByMarket.keys()].filter(id => topAlert(id))
    .sort((a,b) => topAlert(a).cls.p - topAlert(b).cls.p || (markets.get(a).rank ?? 999) - (markets.get(b).rank ?? 999));

  const noun = mode === 'counties' ? 'counties' : 'markets';
  const one = mode === 'counties' ? 'county' : 'market';
  $('count').innerHTML = active.length ? `<strong>${active.length}</strong> ${active.length === 1 ? one : noun} under ${levelWords()}` : `No ${noun} under ${levelWords()}`;

  // List
  $('mlist').innerHTML = active.length ? active.map(id => {
    const m = markets.get(id), l = visible(id);
    return `<li><button type="button" data-id="${esc(id)}" aria-current="${id === selected}">
      <span class="bar" style="background:${l[0].cls.color}"></span>
      <span><span class="nm">${esc(displayName(m.name))}</span><span class="ev">${esc(l[0].cls.event)}${l[0].cls.tags.length ? ' (' + esc(l[0].cls.tags.join(', ')) + ')' : ''}</span></span>
      <span class="n">${l.length}</span></button></li>`;
  }).join('') : `<li class="empty">Nothing at the levels selected right now.</li>`;

  // Legend
  const counts = new Map();
  // Every alert type showing, with how many markets each covers
  for (const id of active){
    const seen = new Set();
    for (const {cls:a} of visible(id)){
      if (seen.has(a.event)) continue;
      seen.add(a.event);
      counts.set(a.event, {color:a.color, p:a.p, n:(counts.get(a.event)?.n || 0) + 1});
    }
  }
  const spcCounts = new Map();
  for (const c of spcByMarket.values()) spcCounts.set(c.code, (spcCounts.get(c.code) || 0) + 1);
  const spcRows = SPC_CATS.filter(c => spc.some(f => f.cat.code === c.code)).reverse()
    .map(c => `<div><span class="swatch" style="background:${c.color}"></span>${esc(c.name)}<span class="c">${spcCounts.get(c.code) || 0}</span></div>`).join('');
  $('legend').innerHTML = [...counts].sort((a,b) => a[1].p - b[1].p)
    .map(([ev, v]) => `<div><span class="swatch" style="background:${v.color}"></span>${esc(ev)}<span class="c">${v.n}</span></div>`).join('')
    + (spcRows ? `<div class="head">SPC Day ${spcDay} outlook, markets</div>${spcRows}` : '');

  if (selected) renderPanel(selected);
}

/* ---------- Radar snippets ---------- */
async function loadRadarSites(){
  try {
    const r = await fetch(RADAR_SITES, {headers:{Accept:'application/geo+json'}});
    if (!r.ok) return;
    const gj = await r.json();
    radarSites = (gj.features || []).map(f => ({
      id: String(f.properties?.id || '').toUpperCase(),
      name: f.properties?.name || '',
      type: /TDWR/i.test(f.properties?.stationType || '') ? 'TDWR' : 'NEXRAD',
      lonlat: f.geometry?.coordinates
    })).filter(x => x.id && Array.isArray(x.lonlat));
  } catch(e){ /* snippets fall back to the national mosaic */ }
}
async function loadCountyOutlines(){
  if (countyOutlines) return countyOutlines;
  try {
    const t = await (await fetch(COUNTY_LINES)).json();
    countyOutlines = topojson.feature(t, t.objects.counties).features.map(f => ({geometry: f.geometry, bounds: d3.geoBounds(f)}));
  } catch(e){ countyOutlines = []; }
  return countyOutlines;
}
const kmBetween = (a, b) => d3.geoDistance(a, b) * 6371;
function nearestSite(pt, type, maxKm){
  let best = null;
  for (const s of radarSites){
    if (s.type !== type) continue;
    const km = kmBetween(pt, s.lonlat);
    if (km <= maxKm && (!best || km < best.km)) best = {...s, km};
  }
  return best;
}

/* NWS storm motion: "...storm...232DEG...27KT...33.95,-98.55" (direction the storm comes FROM) */
function stormMotion(p){
  const d = (p.parameters?.eventMotionDescription || [])[0] || '';
  const m = /(\d{1,3})DEG\.\.\.(\d+)KT\.\.\.([-\d., ]+)$/.exec(d);
  if (!m) return null;
  const pts = m[3].trim().split(/\s+/).map(x => x.split(',').map(Number)).filter(x => x.length === 2 && !x.some(isNaN)).map(([lat, lon]) => [lon, lat]);
  return pts.length ? {from: +m[1], kt: +m[2], pts} : null;
}

const R_EARTH = 6378137, HALF = Math.PI * R_EARTH;
const merc = ([lon, lat]) => [R_EARTH * lon * Math.PI / 180, R_EARTH * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
const unmerc = ([x, y]) => [x / R_EARTH * 180 / Math.PI, (2 * Math.atan(Math.exp(y / R_EARTH)) - Math.PI / 2) * 180 / Math.PI];

function radarSources(entry, centre, bbox, W, H, tick){
  const wms = (ws, layer) => `${NOAA_RADAR}/${ws}/${layer}/ows?service=WMS&version=1.1.1&request=GetMap&layers=${layer}&styles=&format=image/png&transparent=true&srs=EPSG:3857&bbox=${bbox.join(',')}&width=${W*2}&height=${H*2}&t=${tick}`;
  const nexrad = nearestSite(centre, 'NEXRAD', 230);
  const out = [];
  if (/^Tornado/.test(entry.cls.event)){
    const tdwr = nearestSite(centre, 'TDWR', 90);
    if (tdwr) out.push({kind:'wms', url: wms(tdwr.id.toLowerCase(), tdwr.id.toLowerCase() + '_bvel'), label:`Base velocity, ${tdwr.id} airport radar`, site: tdwr, vel:true});
    if (nexrad) out.push({kind:'tiles', template: `${IEM_TILES}/ridge::${nexrad.id.slice(1)}-N0U-0/{z}/{x}/{y}.png?t=${tick}`, label:`Base velocity, ${nexrad.id} (via Iowa Mesonet)`, site: nexrad, vel:true});
  }
  if (nexrad) out.push({kind:'wms', url: wms(nexrad.id.toLowerCase(), nexrad.id.toLowerCase() + '_sr_bref'), label:`Base reflectivity, ${nexrad.id}`, site: nexrad});
  out.push({kind:'wms', url: wms('conus', 'conus_bref_qcd'), label:'Reflectivity, national mosaic', site: nexrad});
  return out;
}

function drawRadar(box, entry){
  const W = 340, H = 210, tick = Math.floor(Date.now() / 120000);
  const geom = entry.geom;
  const rings = geom.type === 'Polygon' ? [geom.coordinates[0]] : geom.coordinates.map(pl => pl[0]);
  const mpts = rings.flat().map(merc);
  let [x0, y0, x1, y1] = [d3.min(mpts, d => d[0]), d3.min(mpts, d => d[1]), d3.max(mpts, d => d[0]), d3.max(mpts, d => d[1])];
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let sx = Math.max((x1 - x0) * 1.6, 70000), sy = Math.max((y1 - y0) * 1.6, 70000 * H / W);
  if (sx / sy < W / H) sx = sy * W / H; else sy = sx * H / W;
  const bbox = [cx - sx/2, cy - sy/2, cx + sx/2, cy + sy/2];
  const px = ll => { const [x, y] = merc(ll); return [(x - bbox[0]) / sx * W, (bbox[3] - y) / sy * H]; };
  const centre = unmerc([cx, cy]);
  const sources = radarSources(entry, centre, bbox, W, H, tick);
  const cap = box.nextElementSibling;
  const pct = (v, of) => (v / of * 100) + '%';

  const tryNext = i => {
    box.querySelectorAll('img, .wait').forEach(n => n.remove());
    const src = sources[i];
    if (!src){
      box.insertAdjacentHTML('afterbegin', '<div class="wait">Radar image unavailable</div>');
      const site = sources[0] && sources[0].site;
      cap.innerHTML = `<span>No radar image could be loaded</span>` +
        (site ? `<a href="https://radar.weather.gov/station/${esc(site.id.toLowerCase())}/standard" target="_blank" rel="noopener">Open ${esc(site.id)} on radar.weather.gov</a>` : '');
      return;
    }
    const done = () => {
      const site = src.site;
      cap.innerHTML = `<span>${esc(src.label)}${site ? `, ${Math.round(site.km)} km away` : ''}, latest scan</span>` +
        (site ? `<a href="https://radar.weather.gov/station/${esc(site.id.toLowerCase())}/standard" target="_blank" rel="noopener">Full radar loop</a>` : '');
    };
    if (src.kind === 'wms'){
      const img = new Image();
      img.alt = src.label;
      Object.assign(img.style, {left:0, top:0, width:'100%', height:'100%'});
      img.onload = done;
      img.onerror = () => tryNext(i + 1);
      img.src = src.url;
      box.prepend(img);
    } else {
      // Map tiles covering the box
      const z = Math.max(4, Math.min(11, Math.floor(Math.log2((2 * HALF) / (256 * sx / W)))));
      const span = (2 * HALF) / 2 ** z;
      const tx0 = Math.floor((bbox[0] + HALF) / span), tx1 = Math.floor((bbox[2] + HALF) / span);
      const ty0 = Math.floor((HALF - bbox[3]) / span), ty1 = Math.floor((HALF - bbox[1]) / span);
      let pending = 0, failed = 0, loaded = 0;
      for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++){
        pending++;
        const img = new Image();
        const left = (tx * span - HALF - bbox[0]) / sx * W, top = (bbox[3] - (HALF - ty * span)) / sy * H, size = span / sx * W;
        Object.assign(img.style, {left: pct(left, W), top: pct(top, H), width: pct(size, W), height: pct(span / sy * H, H)});
        img.onload = () => { loaded++; if (loaded + failed === pending && loaded) done(); };
        img.onerror = () => { failed++; if (failed === pending) tryNext(i + 1); else if (loaded + failed === pending) done(); };
        img.src = src.template.replace('{z}', z).replace('{x}', tx).replace('{y}', ty);
        box.prepend(img);
      }
    }
  };

  // Overlay: county lines, the warning polygon, storm position and motion, radar site
  const line = d3.geoPath(d3.geoTransform({point(lon, lat){ const [x, y] = px([lon, lat]); this.stream.point(x, y); }}));
  const svgNode = d3.select(box).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet').attr('aria-hidden','true');
  const gLines = svgNode.append('g');
  const [lonA, latA] = unmerc([bbox[0], bbox[1]]), [lonB, latB] = unmerc([bbox[2], bbox[3]]);
  loadCountyOutlines().then(list => {
    const near = list.filter(c => !(c.bounds[1][0] < lonA || c.bounds[0][0] > lonB || c.bounds[1][1] < latA || c.bounds[0][1] > latB));
    gLines.selectAll('path').data(near).join('path').attr('d', d => line(d.geometry))
      .attr('fill','none').attr('stroke','rgba(255,255,255,.28)').attr('stroke-width',.7);
  });
  const ringPath = rings.map(r => 'M' + r.map(px).map(q => q.map(v => v.toFixed(1)).join(',')).join('L') + 'Z').join('');
  svgNode.append('path').attr('d', ringPath).attr('fill','none').attr('stroke','#000').attr('stroke-width',4).attr('stroke-opacity',.5);
  svgNode.append('path').attr('d', ringPath).attr('fill','none').attr('stroke', entry.cls.color).attr('stroke-width',2.2);
  const mo = stormMotion(entry.p);
  if (mo){
    const toward = (mo.from + 180) % 360 * Math.PI / 180;
    for (const pt of mo.pts){
      const [ax, ay] = px(pt);
      // arrow shows about 20 minutes of travel
      const dist = mo.kt * 1852 * (20 / 60) / Math.cos(pt[1] * Math.PI / 180);
      const bx = ax + Math.sin(toward) * dist / sx * W, by = ay - Math.cos(toward) * dist / sy * H;
      if (mo.kt > 0) svgNode.append('line').attr('x1',ax).attr('y1',ay).attr('x2',bx).attr('y2',by)
        .attr('stroke','#fff').attr('stroke-width',2).attr('marker-end','url(#arrowhead)');
      svgNode.append('circle').attr('cx',ax).attr('cy',ay).attr('r',4).attr('fill','#fff').attr('stroke','#000').attr('stroke-width',1.2);
    }
    svgNode.append('defs').html('<marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#fff"/></marker>');
  }
  tryNext(0);
}

function fillRadars(list){
  const boxes = [...document.querySelectorAll('#pbody .radar[data-i]')];
  radarSitesReady.then(() => boxes.forEach(box => {
    if (!box.isConnected) return;       // the panel was redrawn in the meantime
    const entry = list[+box.dataset.i];
    if (entry && entry.geom) drawRadar(box, entry);
  }));
}

/* ---------- Market panel ---------- */
const NET_ORDER = ['ABC','CBS','NBC','FOX'];
function ago(iso){
  if (!iso) return '';
  const mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} hr ago`;
  const d = Math.round(h / 24);
  return d === 1 ? 'yesterday' : `${d} days ago`;
}
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

/* Live stream (or website) links for the market's stations, Big Four first */
function watchHTML(name){
  const mi = marketInfo.get(name);
  if (!mi) return '';
  const netRank = st => Math.min(...st.networks.map(n => NET_ORDER.indexOf(n)).filter(i => i >= 0), 9);
  const list = mi.stations.filter(st => safeUrl(st.url))
    .sort((a, b) => (b.tier === 'big4') - (a.tier === 'big4') || netRank(a) - netRank(b) || a.call.localeCompare(b.call));
  if (!list.length) return '';
  return `<h3>Watch coverage</h3><div class="watchlist">${list.map(st =>
    `<a class="watch" href="${esc(st.url)}" target="_blank" rel="noopener" title="${/live|stream|watch/i.test(st.url) ? 'Live stream' : 'Station website'}">${esc(st.call)} <span class="net">${esc(st.networks.join('/'))}</span></a>`).join('')}</div>`;
}

function spcHTML(id){
  if (!spcDay) return '';
  const data = spcData[spcDay];
  if (!data) return '';
  if (data.failed) return `<h3>SPC Day ${spcDay} outlook</h3><p class="later">Couldn't load the outlook.</p>`;
  const c = spcByMarket.get(id);
  const times = [data.valid && `Valid from ${sydDayFmt.format(data.valid)}`, data.expires && `to ${sydDayFmt.format(data.expires)} Sydney`].filter(Boolean).join(' ');
  return `<h3>SPC Day ${spcDay} outlook</h3>
    <div class="spcbox" style="border-color:${c ? c.color : 'var(--panel-edge)'}">
      <b>${c ? esc(c.name) + (c.level ? ` (${c.level} of 5)` : '') : 'No severe risk outlined'}</b>
      ${times ? `<p>${esc(times)}</p>` : ''}
    </div>`;
}

function renderPanel(id){
  const m = markets.get(id);
  if (!m) return;
  const all = alertsByMarket.get(id) || [];
  const list = visible(id);
  const metaBits = [];
  if (m.rank) metaBits.push(`Market #${m.rank}`);
  if (mode !== 'counties') metaBits.push(`${m.fips.length} ${m.fips.length === 1 ? 'county' : 'counties'}`);
  if (m.tz) metaBits.push(m.tz.replace('America/','').replace('Pacific/','').replace(/_/g,' ') + ' time');

  const picked = pickedCounty && countyToMarket.get(pickedCounty) === id ? pickedCounty : null;
  const pickedName = picked ? `${countyName.get(picked) || picked} County` : '';
  let radarCount = 0;
  const warnings = list.length ? list.map(({p, cls, fips, geom}, i) => {
    const names = fips.map(f => countyName.get(f) || f).sort();
    const end = p.ends || p.expires;
    const others = (alertMarkets.get(p.id) || []).filter(x => x !== id);
    const also = others.length && mode !== 'counties'
      ? `<p class="also">Also covers ${others.map(x => `<button type="button" class="mlink" data-market="${esc(x)}">${esc(displayName(markets.get(x)?.name || x))}</button>`).join(', ')}</p>` : '';
    return `<div class="warn" style="border-color:${cls.color}">
      <div class="ev">${esc(cls.event)}${cls.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}${picked && fips.includes(picked) ? `<span class="here">${esc(pickedName)}</span>` : ''}</div>
      <p class="when">Until ${esc(marketTime(end, m.tz))}, ${esc(sydDayFmt.format(new Date(end)))} Sydney</p>
      <p class="issued">Issued ${esc(marketTime(p.sent, m.tz))}, ${esc(ago(p.sent))}</p>
      <p class="small">${mode === 'counties' ? '' : esc(names.join(', ')) + '<br>'}${esc(p.senderName || '')}</p>
      ${also}
      ${geom && RADAR_EVENTS.test(cls.event) && radarCount++ < 3 ? `<div class="radar" data-i="${i}"></div><p class="rcap">Loading radar…</p>` : ''}
      ${p.description ? `<details><summary>Full text</summary><pre>${esc(p.description)}${p.instruction ? '\n\n' + esc(p.instruction) : ''}</pre></details>` : ''}
    </div>`;
  }).join('') : `<p class="later">No active NWS alerts at the levels shown.</p>`;
  const hiddenCount = all.length - list.length;
  const hidden = hiddenCount ? `<p class="hidden-note">${hiddenCount} more ${hiddenCount === 1 ? 'alert is' : 'alerts are'} hidden by the level buttons at the top.</p>` : '';

  $('pbody').innerHTML = `
    <h2>${esc(displayName(m.name))}</h2>
    <p class="meta">${esc(metaBits.join(', '))}</p>
    ${picked && mode !== 'counties' ? `<p class="picked-note">You clicked ${esc(pickedName)}${countyVisible(picked).length ? `, under ${countyVisible(picked).length} ${countyVisible(picked).length === 1 ? 'alert' : 'alerts'}` : ', no alerts there at the levels shown'}.</p>` : ''}
    ${spcHTML(id)}
    <h3>Active alerts</h3>
    ${warnings}
    ${hidden}
    ${mode === 'counties' ? '' : watchHTML(m.name)}`;
  fillRadars(list);
}

function select(id, zoomTo){
  selected = id;
  $('panel').classList.add('open');
  paint();
  if (zoomTo){
    const f = marketFeatures.find(d => d.id === id);
    if (f){
      const [[x0,y0],[x1,y1]] = path.bounds(f);
      const k = Math.min(10, 0.6 / Math.max((x1-x0)/975, (y1-y0)/610));
      // Centre the market in the part of the map the panel isn't covering
      const wrap = $('mapwrap').getBoundingClientRect(), pr = $('panel').getBoundingClientRect();
      const wide = innerWidth > 760;
      const cx = wide ? 975 * (1 - Math.min(pr.width / wrap.width, .6)) / 2 : 975 / 2;
      const cy = wide ? 610 / 2 : 610 * (1 - Math.min(pr.height / wrap.height, .7)) / 2;
      svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600)
        .call(zoom.transform, d3.zoomIdentity.translate(cx, cy).scale(k * (wide ? .75 : .6)).translate(-(x0+x1)/2, -(y0+y1)/2));
    }
  }
}
function closePanel(){
  selected = null;
  pickedCounty = null;
  $('panel').classList.remove('open');
  paint();
}

/* ---------- Wiring ---------- */
$('mlist').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b){ pickedCounty = null; select(b.dataset.id, true); } });
$('close').addEventListener('click', closePanel);
$('pbody').addEventListener('click', e => {
  const b = e.target.closest('button[data-market]');
  if (b){ pickedCounty = null; select(b.dataset.market, true); }
});
function syncLevels(){
  document.querySelectorAll('.levels button').forEach(b => b.setAttribute('aria-pressed', levels.has(b.dataset.level)));
}
document.querySelector('.levels').addEventListener('click', e => {
  const b = e.target.closest('button[data-level]');
  if (!b) return;
  const lv = b.dataset.level;
  levels.has(lv) ? levels.delete(lv) : levels.add(lv);
  try { localStorage.setItem('dsm-levels', JSON.stringify([...levels])); } catch(err){}
  syncLevels();
  paint();
});
syncLevels();

function syncSPC(){
  document.querySelectorAll('.outlook button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.day === spcDay));
}
document.querySelector('.outlook').addEventListener('click', e => {
  const b = e.target.closest('button[data-day]');
  if (!b || b.disabled) return;
  spcDay = +b.dataset.day;
  try { localStorage.setItem('dsm-spc', spcDay); } catch(err){}
  syncSPC();
  computeSPCByMarket();
  paint();
});
syncSPC();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) closePanel(); });
$('refresh').addEventListener('click', loadAlerts);
$('zin').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 1.6));
$('zout').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 1/1.6));
$('zreset').addEventListener('click', () => svg.transition().call(zoom.transform, d3.zoomIdentity));

(async function start(){
  tickClock(); setInterval(tickClock, 15000);
  try {
    topo = await (await fetch(ATLAS_URL)).json();
  } catch(e){
    notice("The county boundaries didn't load, so the map can't be drawn. Check the connection and reload.", true);
    return;
  }
  for (const g of topo.objects.counties.geometries) countyName.set(g.id, g.properties.name);
  for (const g of topo.objects.states.geometries) stateName.set(g.id, g.properties.name);

  const cw = await loadCrosswalk();
  buildMarkets(cw);
  if (mode === 'counties')
    notice('Showing individual counties for now. Upload county-dma-crosswalk.json beside this page to draw the 210 markets.');
  else {
    const unassigned = topo.objects.counties.geometries.filter(g => !countyToMarket.has(g.id)).length;
    if (unassigned) notice(`${markets.size} markets loaded. ${unassigned} counties on the map aren't in the crosswalk and are left uncoloured.`);
  }
  if (mode !== 'counties') await loadStationList();
  buildFeatures();
  drawBase();
  await loadAlerts();
  setInterval(loadAlerts, REFRESH_MS);
  refreshSPC();
  radarSitesReady = loadRadarSites();
  setInterval(refreshSPC, SPC_REFRESH_MS);
})();
</script>
